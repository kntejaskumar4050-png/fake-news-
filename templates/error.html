{% extends "base.html" %}
{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container error-inner">
    <span class="error-code">{{ code }}</span>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="{{ url_for('index') }}">Back to home</a>
      <a class="btn btn-ghost" href="{{ url_for('detect') }}">Analyse an article</a>
    </div>
  </div>
</section>
{% endblock %}
